<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBC Intent Editor</title>
<link rel="stylesheet" href="css/foundation.css">
<link rel="stylesheet" href="css/workspace.css">
<link rel="stylesheet" href="css/review.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">G</div>
      <div><div class="brand-title" data-i18n="brandTitle">Intent Editor</div><div class="brand-sub" data-i18n="brandSub">Architecture workspace</div></div>
    </div>
    <button class="project-switcher" id="projectSwitcher" data-i18n-title="projectSwitcherTitle">
      <span class="pmark">⌘</span><span class="path" id="projectPath"></span><span class="chevron">⌄</span>
    </button>
    <div class="toolbar-status">
      <span class="status-chip" id="dirtyChip"><span class="status-dot"></span><span id="dirtyText"></span></span>
      <span class="status-chip" id="diskChip"><span class="status-dot"></span><span id="diskText"></span></span>
    </div>
    <div class="actions">
      <button class="btn subtle" id="reloadBtn" data-i18n="load">Load</button>
      <button class="btn" id="resetBtn" data-i18n="reset">Revert</button>
      <button class="btn" id="reviewBtn" data-i18n="review">View changes</button>
      <button class="btn primary" id="saveBtn" data-i18n="save">Save</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar">
      <div class="side-head">
        <span class="side-title" data-i18n="projectStructure">Project structure</span>
        <button class="btn subtle small" id="collapseAllBtn" data-i18n-title="collapseAll" title="Collapse all">•••</button>
      </div>
      <div class="tree-scroll" id="tree"></div>
    </aside>
    <main class="main"><div class="content" id="editor"></div></main>
  </div>

  <footer class="statusbar">
    <span data-i18n="schema">GBC intent schema v2</span><span data-i18n="utf8">UTF-8</span><span id="langLabel" data-i18n="langLabel">Language: English</span>
    <span class="right" id="statusMessage" data-i18n="draftStatus">Draft is kept in browser memory</span>
  </footer>
</div>

<div class="scrim" id="drawerScrim"></div>
<aside class="drawer" id="reviewDrawer" aria-label="View changes">
  <div class="drawer-head">
    <div class="drawer-title-row"><div class="drawer-title" data-i18n="drawerTitle">View changes</div><span class="change-total" id="totalChanges"></span></div>
    <div class="compare-tabs" id="compareTabs"></div>
    <div class="compare-note"><span>ⓘ</span><span data-i18n="compareNote">Uses the loaded snapshot by default, without re-reading disk.</span></div>
    <div class="external-alert" id="externalAlert"></div>
  </div>
  <div class="drawer-body" id="diffContent"></div>
  <div class="drawer-foot">
    <div class="export-group">
      <button class="btn small" id="copyBtn" data-i18n="copyText">Copy text</button>
      <button class="btn small" id="downloadBtn" data-i18n="downloadTxt">Download .txt</button>
    </div>
    <div class="split"></div>
    <button class="btn" id="cancelReviewBtn" data-i18n="cancel">Cancel</button>
    <button class="btn danger" id="drawerResetBtn" data-i18n="resetToLoaded">Revert to loaded</button>
    <button class="btn primary" id="drawerSaveBtn" data-i18n="saveChanges">Save changes</button>
  </div>
</aside>

<div class="modal-scrim" id="modalScrim">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><div class="modal-title" id="modalTitle"></div></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
