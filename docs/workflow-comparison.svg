<svg width="960" height="620" viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow-heavy" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.18"/>
    </filter>

    <marker id="arrow-dark" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#424242"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
    </marker>

    <linearGradient id="grad-vs-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" fill="url(#grad-vs-bg)" rx="8"/>

  <!-- Title -->
  <text x="480" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#212121" text-anchor="middle">Agent 修改代码：无 GBC vs 有 GBC</text>

  <!-- Divider line -->
  <line x1="480" y1="60" x2="480" y2="580" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ============================================================ -->
  <!-- LEFT: WITHOUT GBC -->
  <!-- ============================================================ -->

  <text x="240" y="88" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#c62828" text-anchor="middle">❌ 无 GBC</text>

  <!-- Step 1: Agent modifies code -->
  <rect x="70" y="105" width="340" height="60" rx="10" fill="#ffffff" stroke="#bdbdbd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#424242" text-anchor="middle">🤖 Agent 修改 client.py</text>
  <text x="240" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#888" text-anchor="middle">改了 chat() 的返回格式</text>

  <line x1="240" y1="165" x2="240" y2="195" stroke="#424242" stroke-width="1.5" marker-end="url(#arrow-dark)"/>

  <!-- Step 2: No verification -->
  <rect x="70" y="200" width="340" height="60" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="225" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#e65100" text-anchor="middle">⚠️ 无验证机制</text>
  <text x="240" y="245" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#bf360c" text-anchor="middle">agent 不知道自己破坏了什么</text>

  <line x1="240" y1="260" x2="240" y2="290" stroke="#424242" stroke-width="1.5" marker-end="url(#arrow-dark)"/>

  <!-- Step 3: Silent breakage -->
  <rect x="70" y="295" width="340" height="80" rx="10" fill="#ffebee" stroke="#ef5350" stroke-width="2" filter="url(#shadow-heavy)"/>
  <text x="240" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#c62828" text-anchor="middle">💥 静默破坏</text>
  <text x="240" y="344" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#d32f2f" text-anchor="middle">manager.py 依赖 chat() 返回 str</text>
  <text x="240" y="362" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#d32f2f" text-anchor="middle">→ 生产环境崩溃 / 数据错误</text>

  <!-- Consequences -->
  <rect x="70" y="395" width="340" height="55" rx="8" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="240" y="416" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#757575" text-anchor="middle">后果</text>
  <text x="240" y="434" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#9e9e9e" text-anchor="middle">· 可能数小时后才发现异常</text>
  <text x="240" y="446" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#9e9e9e" text-anchor="middle">· 排查链路长 · 信任崩塌 · 人工返工</text>

  <!-- ============================================================ -->
  <!-- RIGHT: WITH GBC -->
  <!-- ============================================================ -->

  <text x="720" y="88" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#2e7d32" text-anchor="middle">✅ 有 GBC</text>

  <!-- Step 0: Learn context -->
  <rect x="550" y="105" width="340" height="60" rx="10" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="720" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#2e7d32" text-anchor="middle">📋 修改前：了解保证</text>
  <text x="720" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#558b2f" text-anchor="middle">who_depends_on / list_provides — 精确知道边界</text>

  <line x1="720" y1="165" x2="720" y2="195" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Step 1: Agent modifies code -->
  <rect x="550" y="200" width="340" height="60" rx="10" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="720" y="225" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#424242" text-anchor="middle">🤖 Agent 修改 client.py</text>
  <text x="720" y="245" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#888" text-anchor="middle">在已知约束下谨慎改动</text>

  <line x1="720" y1="260" x2="720" y2="290" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Step 2: verify_provider -->
  <rect x="550" y="295" width="340" height="60" rx="10" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="720" y="318" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1565c0" text-anchor="middle">🔬 verify_provider(client.py)</text>
  <text x="720" y="338" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#1976d2" text-anchor="middle">自动运行所有已注册保证的测试</text>

  <!-- Fork -->
  <line x1="720" y1="355" x2="720" y2="380" stroke="#424242" stroke-width="1.5"/>
  <line x1="720" y1="380" x2="620" y2="380" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="720" y1="380" x2="820" y2="380" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="720" y="375" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#757575" text-anchor="middle">门控判定</text>

  <!-- GREEN path -->
  <rect x="550" y="388" width="180" height="70" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="414" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#2e7d32" text-anchor="middle">✅ 全绿</text>
  <text x="640" y="434" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#558b2f" text-anchor="middle">所有保证成立</text>
  <text x="640" y="450" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#689f38" text-anchor="middle">→ 修改可接受</text>

  <!-- RED path -->
  <rect x="750" y="388" width="170" height="70" rx="10" fill="#ffebee" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="835" y="414" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#c62828" text-anchor="middle">🛑 有红</text>
  <text x="835" y="434" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#d32f2f" text-anchor="middle">保证被破坏</text>
  <text x="835" y="450" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#e53935" text-anchor="middle">→ 精确拦截 + 报告</text>

  <!-- Result -->
  <rect x="550" y="478" width="370" height="55" rx="8" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="735" y="499" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#2e7d32" text-anchor="middle">结果</text>
  <text x="735" y="517" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#558b2f" text-anchor="middle">· 即时反馈 · 精确定位 · 信任可验证 · 零人工返工</text>

  <!-- ============================================================ -->
  <!-- KEY INSIGHT -->
  <!-- ============================================================ -->

  <rect x="180" y="545" width="600" height="55" rx="12" fill="#263238" filter="url(#shadow-heavy)"/>
  <text x="480" y="570" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">核心洞察：正确性从「AI 觉得自己改对了」→「所有保证仍然通过」</text>
  <text x="480" y="590" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#b0bec5" text-anchor="middle">一个可以机械验证的布尔条件，不依赖 agent 的理解能力</text>
</svg>
